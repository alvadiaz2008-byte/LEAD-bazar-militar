name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/web _site/public _site/imagenes
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp web/styles.css web/app.js web/app.c0.js web/app.c1.js web/app.c2.js web/app.c3.js web/app.c4.js web/map.js web/products.js web/catalog.json _site/web/
          for f in favicon.webp logo.webp og.jpg favicon.png logo.png; do
            if [ -f "public/$f" ]; then
              cp "public/$f" _site/public/
            fi
          done
          cp -r imagenes/. _site/imagenes/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
